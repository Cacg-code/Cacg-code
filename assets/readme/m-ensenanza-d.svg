<svg xmlns="http://www.w3.org/2000/svg" width="896" height="345" viewBox="0 0 896 345" role="img" aria-label="Cursos gratis"><style>
    .t{font-family:Segoe UI,Helvetica,Arial,sans-serif}
    .fl{animation:fl 7s ease-in-out infinite}.fl2{animation-delay:.8s}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .pr{transform-box:fill-box;transform-origin:left;animation:pr 6s ease-in-out infinite}.pr2{animation-delay:1.2s}
    @keyframes pr{0%{transform:scaleX(.02)}60%,85%{transform:scaleX(1)}100%{transform:scaleX(.02)}}
    .ch{animation:ch 6s infinite;opacity:0}
    .ch1{animation-delay:.2s}.ch2{animation-delay:.4s}.ch3{animation-delay:.6s}.ch4{animation-delay:.8s}.ch5{animation-delay:1s}.ch6{animation-delay:1.2s}
    @keyframes ch{0%{opacity:0;transform:translateY(8px)}10%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    .ar{animation:ar 1.6s ease-in-out infinite}@keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
    .st{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(20deg)}}
  </style><svg x="0" y="0" width="440" height="345" viewBox="0 0 440 345" overflow="hidden">
  <defs>
    <linearGradient id="c0_a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#312e81"/><stop offset="1" stop-color="#14102e"/></linearGradient>
