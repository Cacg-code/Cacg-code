      <text x="28" y="104" font-size="30" font-weight="800" fill="#fff">Chatbots de WhatsApp</text>
      <text x="28" y="134" font-size="16" fill="#99f6e4">28 lecciones · simulador · 113 pruebas</text>
      <g transform="translate(28 154)"><rect width="200" height="34" rx="14" fill="#1f2937"/><text x="14" y="22" font-size="13.5" fill="#d1d5db">Hola, ¿qué tienen hoy?</text>
        <rect x="212" y="0" width="172" height="34" rx="14" fill="#134e4a"/><text x="226" y="22" font-size="13.5" fill="#fff">Catálogo · Pedido · Pago</text></g>
      <text x="28" y="232" font-size="14" fill="#ccfbf1">Del primer mensaje al despliegue en Cloudflare:</text>
      <text x="28" y="252" font-size="14" fill="#ccfbf1">memoria, plantillas, costos y cómo venderlo.</text>
      <rect x="28" y="280" width="384" height="12" rx="6" fill="#08191c"/><rect class="pr pr2" x="28" y="280" width="384" height="12" rx="6" fill="url(#c0_p2)"/>
      <text x="28" y="312" font-size="12.5" fill="#6fd3c4">Con simulador de WhatsApp en el navegador</text></g></g>
    <g transform="translate(500 360)"><text text-anchor="middle" font-size="14.5" fill="#c4b5fd">Hechos por un estudiante, con apoyo de IA, como aporte a la comunidad.</text></g>
  </g>
