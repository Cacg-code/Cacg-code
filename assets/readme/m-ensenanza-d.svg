    <linearGradient id="c0_p2" x1="0" x2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
  </defs>
  
  <g class="t">
    <!-- Curso 1 -->
    <g class="fl"><rect x="0" y="10" width="440" height="320" rx="24" fill="url(#c0_a)" stroke="#a78bfa" stroke-opacity=".6"/>
      <rect x="28" y="34" width="86" height="26" rx="13" fill="#16a34a"/><text x="71" y="52" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">100% GRATIS</text>
      <text x="28" y="104" font-size="30" font-weight="800" fill="#fff">Web desde cero</text>
