      <g font-size="13" font-weight="700" fill="#fff">
        <g class="ch ch1"><rect x="28" y="160" width="62" height="28" rx="14" fill="#e34f26"/><text x="59" y="179" text-anchor="middle">HTML</text></g>
        <g class="ch ch2"><rect x="98" y="160" width="56" height="28" rx="14" fill="#1572b6"/><text x="126" y="179" text-anchor="middle">CSS</text></g>
        <g class="ch ch3"><rect x="162" y="160" width="40" height="28" rx="14" fill="#d4b106"/><text x="182" y="179" text-anchor="middle" fill="#111">JS</text></g>
        <g class="ch ch4"><rect x="210" y="160" width="68" height="28" rx="14" fill="#087ea4"/><text x="244" y="179" text-anchor="middle">React</text></g>
        <g class="ch ch5"><rect x="286" y="160" width="68" height="28" rx="14" fill="#15803d"/><text x="320" y="179" text-anchor="middle">Node</text></g>
        <g class="ch ch6"><rect x="362" y="160" width="50" height="28" rx="14" fill="#7c3aed"/><text x="387" y="179" text-anchor="middle">SQL</text></g>
      </g>
      <text x="28" y="232" font-size="14" fill="#ddd6fe">Editores en vivo, ejercicios que se corrigen solos,</text>
      <text x="28" y="252" font-size="14" fill="#ddd6fe">niveles y rachas. Sin cuentas ni instalar nada.</text>
      <rect x="28" y="280" width="384" height="12" rx="6" fill="#0a0a14"/><rect class="pr" x="28" y="280" width="384" height="12" rx="6" fill="url(#c0_p1)"/>
      <text x="28" y="312" font-size="12.5" fill="#a5a0d6">Tu progreso se guarda en tu navegador</text></g>
    <!-- Flecha -->
    <g transform="translate(450 150)"><text x="0" y="0" font-size="13" font-weight="800" fill="#fbbf24" letter-spacing="1">SIGUIENTE</text>
      <g class="ar"><path d="M0 24h86" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/><path d="M68 8l18 16-18 16" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g>
    <!-- Curso 2 -->
