<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="Stack: HTML, CSS, JavaScript, React, Vite, Node.js, MySQL, Cloudflare Workers, Apps Script">
  <defs><clipPath id="c"><rect width="1000" height="90" rx="18"/></clipPath>
    <linearGradient id="fl" x1="0" x2="1"><stop offset="0" stop-color="#0b0b14"/><stop offset=".08" stop-color="#0b0b14" stop-opacity="0"/><stop offset=".92" stop-color="#0b0b14" stop-opacity="0"/><stop offset="1" stop-color="#0b0b14"/></linearGradient></defs>
  <style>.t{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:18px;font-weight:700}.run{animation:r 28s linear infinite}@keyframes r{to{transform:translateX(-1260px)}}</style>
  <rect width="1000" height="90" rx="18" fill="#0b0b14" stroke="#a78bfa" stroke-opacity=".3"/>
  <g clip-path="url(#c)"><g class="run t" fill="#fff">
    <g id="s">
      <rect x="20" y="25" width="100" height="40" rx="20" fill="#e34f26"/><text x="70" y="51" text-anchor="middle">HTML</text>
      <rect x="140" y="25" width="90" height="40" rx="20" fill="#1572b6"/><text x="185" y="51" text-anchor="middle">CSS</text>
      <rect x="250" y="25" width="140" height="40" rx="20" fill="#d4b106"/><text x="320" y="51" text-anchor="middle" fill="#111">JavaScript</text>
      <rect x="410" y="25" width="100" height="40" rx="20" fill="#087ea4"/><text x="460" y="51" text-anchor="middle">React</text>
      <rect x="530" y="25" width="90" height="40" rx="20" fill="#7c3aed"/><text x="575" y="51" text-anchor="middle">Vite</text>
      <rect x="640" y="25" width="110" height="40" rx="20" fill="#15803d"/><text x="695" y="51" text-anchor="middle">Node.js</text>
      <rect x="770" y="25" width="100" height="40" rx="20" fill="#0e7490"/><text x="820" y="51" text-anchor="middle">MySQL</text>
      <rect x="890" y="25" width="190" height="40" rx="20" fill="#ea580c"/><text x="985" y="51" text-anchor="middle">Cloudflare Workers</text>
      <rect x="1100" y="25" width="140" height="40" rx="20" fill="#2563eb"/><text x="1170" y="51" text-anchor="middle">Apps Script</text>
    </g>
    <use href="#s" x="1260"/>
  </g></g>
  <rect width="1000" height="90" rx="18" fill="url(#fl)"/>
</svg>
